<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Simulados DMAE Uberlândia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: caderno de prova na esquerda, folha de respostas (gabarito) fixa na direita; no celular a folha abre por baixo. */
:root {
  --bg: #F1F2EE;
  --surface: #FFFFFF;
  --ink: #11181F;
  --muted: #566170;
  --line: #D3D7D0;
  --bar: #CBCFC8;
  --accent: #1B3DA6;
  --accent-ink: #FFFFFF;
  --accent-soft: #E4E9F8;
  --ok: #17764B;
  --ok-soft: #DDF1E6;
  --bad: #B3261E;
  --bad-soft: #F8E2E0;
  --flag: #A85F00;
  --flag-soft: #FBEBD2;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1318; --surface: #161D25; --ink: #E7EBEF; --muted: #9BA7B3; --line: #2A343E; --bar: #26303A;
    --accent: #86A2FF; --accent-ink: #0A1022; --accent-soft: #1C2742;
    --ok: #52C98F; --ok-soft: #14301F; --bad: #FF8F86; --bad-soft: #3A1C1A;
    --flag: #F2B04A; --flag-soft: #3A2B10; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1318; --surface: #161D25; --ink: #E7EBEF; --muted: #9BA7B3; --line: #2A343E; --bar: #26303A;
  --accent: #86A2FF; --accent-ink: #0A1022; --accent-soft: #1C2742;
  --ok: #52C98F; --ok-soft: #14301F; --bad: #FF8F86; --bad-soft: #3A1C1A;
  --flag: #F2B04A; --flag-soft: #3A2B10; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.55; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1120px; margin-inline: auto; padding-inline: 16px; padding-block: 20px 96px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.bar-label { font-family: var(--f-display); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: 13px; background: var(--bar); padding: 6px 12px; }

/* Home */
.masthead { display: grid; gap: 10px; padding-block: 12px 22px; border-bottom: 3px solid var(--ink); margin-bottom: 22px; }
.masthead .org { font-family: var(--f-display); font-weight: 700; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.masthead h1 { font-size: clamp(30px, 6vw, 52px); font-weight: 800; letter-spacing: -.01em; }
.masthead p { margin: 0; max-width: 62ch; color: var(--muted); }
.notice { background: var(--surface); border: 1px solid var(--line); padding: 14px 16px; margin-bottom: 26px; display: grid; gap: 6px; font-size: 15px; }
.notice b { font-family: var(--f-display); }
.section-title { font-size: 14px; font-family: var(--f-display); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 6px 0 12px; }
.provas { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 14px; margin-bottom: 30px; }
.caderno { background: var(--surface); border: 1px solid var(--line); border-top: 6px solid var(--ink); padding: 16px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.caderno .num { font-family: var(--f-display); font-weight: 800; font-size: 40px; line-height: 1; }
.caderno .head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.caderno .origem { font-size: 13px; color: var(--muted); font-family: var(--f-display); font-weight: 500; }
.comp { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--f-mono); font-size: 12px; border: 1px solid var(--line); padding: 2px 8px; color: var(--muted); }
.best { font-size: 14px; color: var(--muted); }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { font-family: var(--f-display); font-weight: 700; font-size: 15px; padding: 10px 16px; border: 2px solid var(--ink); background: transparent; min-height: 44px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:hover { background: var(--ink); color: var(--bg); }
.btn.primary:hover { filter: brightness(1.12); background: var(--accent); color: var(--accent-ink); }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 13px; }
.btn.link { border: 0; text-decoration: underline; padding-inline: 4px; min-height: 36px; font-weight: 500; }
.btn.link:hover { background: transparent; color: var(--accent); }
.areas { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 10px; }
.areas .btn { text-align: left; display: grid; gap: 2px; font-weight: 700; }
.areas .btn span { font-family: var(--f-mono); font-weight: 500; font-size: 12px; opacity: .75; }

/* Prova */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 2px solid var(--ink); padding-block: 10px; margin-bottom: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.topbar .title { font-family: var(--f-display); font-weight: 800; font-size: 20px; margin-right: auto; }
.topbar .sub { font-family: var(--f-display); font-weight: 500; font-size: 13px; color: var(--muted); display: block; letter-spacing: .04em; text-transform: uppercase; }
.timer { font-family: var(--f-mono); font-weight: 600; font-size: 18px; }
.quiz { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-items: start; }
@media (min-width: 960px) { .quiz { grid-template-columns: minmax(0, 1fr) 300px; } }
.qcard { background: var(--surface); border: 1px solid var(--line); min-width: 0; }
.qcard .inner { padding: 18px 18px 20px; display: grid; gap: 16px; }
.qhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.qnum { font-family: var(--f-display); font-weight: 800; font-size: 22px; }
.flagbtn { margin-left: auto; font-family: var(--f-display); font-weight: 700; font-size: 13px; border: 2px solid var(--line); background: transparent; padding: 6px 12px; min-height: 36px; }
.flagbtn[aria-pressed="true"] { background: var(--flag-soft); border-color: var(--flag); color: var(--flag); }
.base { border-left: 4px solid var(--ink); background: var(--bg); padding: 12px 16px; font-size: 16px; }
.base summary { cursor: pointer; font-family: var(--f-display); font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; }
.base .bt { font-family: var(--f-display); font-weight: 700; margin: 8px 0 2px; }
.base .by { font-size: 13px; color: var(--muted); margin: 0 0 8px; }
.base p { margin: 0 0 .7em; max-width: 68ch; }
.base .nota { font-size: 14px; color: var(--muted); }
.enun { max-width: 70ch; }
.enun small { color: var(--muted); }
.fig { background: var(--bg); border: 1px solid var(--line); padding: 10px; display: grid; justify-items: center; overflow-x: auto; }
.fig svg { max-width: 100%; height: auto; }
table.tb { border-collapse: collapse; margin: 10px 0; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
table.tb td { border: 1px solid var(--ink); padding: 4px 14px; text-align: center; }
.opts { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 12px; align-items: start; text-align: left; background: var(--surface); border: 2px solid var(--line); padding: 12px 14px; min-height: 52px; }
.opt:hover:not([disabled]) { border-color: var(--ink); }
.opt .bub { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--ink); display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 15px; }
.opt .otx { padding-top: 4px; overflow-wrap: anywhere; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt[aria-pressed="true"] .bub { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.ok .bub { background: var(--ok); border-color: var(--ok); color: var(--bg); }
.opt.bad { border-color: var(--bad); background: var(--bad-soft); }
.opt.bad .bub { background: var(--bad); border-color: var(--bad); color: var(--bg); }
.opt[disabled] { cursor: default; }
.feedback { border: 2px solid var(--line); padding: 12px 16px; font-size: 16px; display: grid; gap: 6px; }
.feedback.ok { border-color: var(--ok); background: var(--ok-soft); }
.feedback.bad { border-color: var(--bad); background: var(--bad-soft); }
.feedback b { font-family: var(--f-display); }
.warn { display: inline-block; font-family: var(--f-display); font-weight: 700; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--flag); border: 1px solid var(--flag); padding: 1px 8px; }
.nav { display: flex; gap: 10px; justify-content: space-between; flex-wrap: wrap; }

/* Folha de respostas */
.sheet { background: var(--surface); border: 1px solid var(--line); border-top: 6px solid var(--ink); padding: 12px 12px 14px; position: sticky; top: calc(88px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 110px); overflow: auto; min-width: 0; }
.sheet h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sheet h2 span { font-family: var(--f-mono); font-size: 12px; color: var(--muted); letter-spacing: 0; text-transform: none; font-weight: 500; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px 14px; }
.row { display: grid; grid-template-columns: 26px repeat(4, 22px); gap: 4px; align-items: center; padding: 2px 3px; border: 1px solid transparent; }
.row.cur { border-color: var(--accent); background: var(--accent-soft); }
.row .rn { font-family: var(--f-mono); font-size: 12px; color: var(--muted); background: transparent; border: 0; padding: 0; text-align: right; position: relative; min-height: 24px; }
.row.flag .rn::after { content: ""; position: absolute; left: -2px; top: 2px; width: 6px; height: 6px; background: var(--flag); border-radius: 50%; }
.bb { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--muted); background: transparent; padding: 0; font-family: var(--f-mono); font-size: 10px; line-height: 1; color: var(--muted); display: grid; place-items: center; }
.bb:hover { border-color: var(--ink); color: var(--ink); }
.bb.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.bb.ok { background: var(--ok); border-color: var(--ok); color: var(--bg); }
.bb.bad { background: var(--bad); border-color: var(--bad); color: var(--bg); }
.bb.gab { border-color: var(--ok); color: var(--ok); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 10px; font-family: var(--f-display); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.mbar { display: none; }
@media (max-width: 959px) {
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; top: auto; z-index: 40; max-height: 72vh; border-inline: 0; transform: translateY(105%); transition: transform .2s ease; padding-bottom: calc(86px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -8px 30px rgba(0,0,0,.25); }
  .sheet.open { transform: none; }
  .mbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: var(--bg); border-top: 2px solid var(--ink); gap: 8px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
  .mbar .btn { flex: 1; padding-inline: 8px; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .desk-nav { display: none; }
}
@media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }

/* Resultado */
.score { display: grid; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-top: 6px solid var(--ink); padding: 18px; margin-bottom: 18px; }
.score .big { font-family: var(--f-display); font-weight: 800; font-size: clamp(44px, 10vw, 84px); line-height: 1; }
.score .big small { font-size: .38em; color: var(--muted); font-weight: 600; }
.areabars { display: grid; gap: 10px; }
.ab { display: grid; grid-template-columns: minmax(110px, 190px) minmax(0, 1fr) 62px; gap: 10px; align-items: center; font-family: var(--f-display); font-size: 14px; font-weight: 500; }
.ab .track { height: 12px; background: var(--bar); position: relative; }
.ab .fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); }
.ab .v { font-family: var(--f-mono); font-size: 13px; text-align: right; }
@media (max-width: 520px) { .ab { grid-template-columns: minmax(0, 1fr) 62px; } .ab .track { grid-column: 1 / -1; order: 3; } }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 12px; }
.filters .btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.review details { background: var(--surface); border: 1px solid var(--line); margin-bottom: 8px; }
.review summary { padding: 10px 14px; cursor: pointer; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-family: var(--f-display); font-weight: 600; min-height: 44px; }
.review summary .st { font-family: var(--f-mono); font-weight: 600; font-size: 13px; padding: 1px 8px; border: 1px solid; }
.st.ok { color: var(--ok); } .st.bad { color: var(--bad); } .st.no { color: var(--muted); }
.review summary .ar { color: var(--muted); font-weight: 500; font-size: 13px; }
.review .body { padding: 4px 16px 16px; display: grid; gap: 14px; }
.empty { padding: 24px; text-align: center; color: var(--muted); border: 1px dashed var(--line); }
.confirm { background: var(--flag-soft); border: 2px solid var(--flag); padding: 14px 16px; margin-bottom: 16px; display: grid; gap: 10px; font-family: var(--f-display); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg text { font-family: var(--f-display); }
</style>

<div class="wrap" id="app"></div>

<script>
const PROVAS = {};
// Textos-base compartilhados por grupos de questões.
const TEXTOS = {
  onca: {
    titulo: "A onça doente",
    autor: "Monteiro Lobato",
    html: `<p>A onça caiu da árvore e por muitos dias esteve de cama seriamente enferma. E como não pudesse caçar, padecia fome das negras.</p>
<p>Em tais apuros imaginou um plano.</p>
<p>— Comadre irara – disse ela – corra o mundo e diga à bicharia que estou à morte e exijo que venham visitar-me.</p>
<p>A irara partiu, deu o recado e os animais, um a um, principiaram a visitar a onça.</p>
<p>Vem o veado, vem a capivara, vem a cutia, vem o porco do mato.</p>
<p>Veio também o jabuti.</p>
<p>Mas o finório jabuti, antes de penetrar na toca, teve a lembrança de olhar o chão. Viu na poeira só rastos entrantes, não viu nenhum rastro sainte. E desconfiou:</p>
<p>— Hum!… Parece que nesta casa quem entra não sai. O melhor, em vez de visitar a nossa querida onça doente, é ir rezar por ela…</p>
<p>E foi o único que se salvou.</p>`
  },
  anuncio: {
    titulo: "Publicidade de cerveja",
    autor: "BR Brew",
    html: `<p>Anúncio da cerveja <i>Catharina Sour</i>, da cervejaria BR Brew, com o nome <b>“Amigo da onça”</b>. A imagem, em tons de cinza, mostra uma ave pousada sobre pedras, com duas onças nos cantos ao fundo. Abaixo ficam o nome do produto e a ficha técnica: amargor 2 IBU, cor 39 EBC, temperatura de serviço de 2 a 4 °C e teor alcoólico (ABV) de 3,7%. Na lateral, em letras verticais, lê-se: <b>“Aprecie com moderação”</b>.</p>
<p class="nota">A imagem da prova original não foi reproduzida aqui; o texto acima descreve seus elementos.</p>`
  },
  marta: {
    titulo: "A fila das oito",
    autor: "Texto original",
    html: `<p>Todas as manhãs, Marta chegava à repartição antes das oito. Não era pressa: gostava de ver o saguão ainda vazio, as cadeiras alinhadas, o cheiro de café recém-passado. Aos poucos, os primeiros cidadãos apareciam, trazendo pastas de plástico e dúvidas.</p>
<p>Marta aprendera que a maior parte da irritação nas filas não vinha da espera, mas da incerteza. Por isso, antes de abrir o atendimento, colava na parede um aviso simples com os documentos necessários e o tempo médio de cada serviço. A reclamação diminuiu, e ninguém precisou de decreto para isso.</p>`
  },
  agua: {
    titulo: "O caminho da água",
    autor: "Texto original",
    html: `<p>A água que chega à torneira percorre um caminho que poucos conhecem. Antes de abastecer a cidade, ela é captada em rios ou poços, passa por tanques onde partículas se depositam, recebe produtos que eliminam microrganismos e só então segue por tubulações enterradas.</p>
<p>Parte desse volume, porém, se perde no trajeto, seja por vazamentos, seja por ligações clandestinas. Reduzir essas perdas é tão importante quanto ampliar a produção, pois cada litro economizado dispensa novas captações e custos adicionais. Por isso, campanhas de consumo consciente e manutenção constante da rede devem andar juntas.</p>`
  },
  oficio: {
    titulo: "O ofício da terça",
    autor: "Texto original",
    html: `<p>O ofício chegou na terça e foi parar, como tantos outros, sobre uma pilha. Ninguém o leu com atenção, porque o assunto vinha escondido no quarto parágrafo, depois de duas linhas de cortesias e de um histórico que ninguém pedira.</p>
<p>Só na sexta, quando o prazo já vencera, alguém percebeu que o documento exigia uma resposta. Desde então, a seção adotou uma regra: o pedido vai logo na primeira frase, e o resto, se houver, vem depois.</p>`
  },
  relatorio: {
    titulo: "Relatório mensal de consumo",
    autor: "Texto original",
    html: `<p>Segundo o relatório mensal, o consumo médio de água por domicílio caiu 6% depois da campanha de conscientização. A queda foi mais acentuada nos bairros onde houve visitas de agentes, o que sugere que o contato direto com os moradores teve efeito maior do que os cartazes e os anúncios.</p>
<p>Os técnicos, no entanto, recomendam cautela: o período coincidiu com chuvas acima da média, fator que também pode ter reduzido o uso de água em jardins e áreas externas.</p>`
  },
  reserv: {
    titulo: "O nível do reservatório",
    autor: "Texto original",
    html: `<p>Na última semana de setembro, o nível do reservatório baixou para menos de 40% da capacidade. A companhia de águas divulgou uma nota explicando que não havia risco imediato de desabastecimento, mas pediu que os moradores evitassem lavar calçadas e carros com mangueira.</p>
<p>Alguns leitores estranharam o pedido: se não havia risco, por que economizar? O diretor técnico respondeu que prevenir custa menos do que remediar. Segundo ele, quem reduz o consumo hoje ajuda o reservatório a atravessar a estiagem sem racionamento, que é a medida mais impopular e mais cara para todos.</p>`
  },
  atend: {
    titulo: "O guichê 3",
    autor: "Texto original",
    html: `<p>No guichê 3, o atendimento começa às nove. Antes disso, Rui confere a lista de senhas, separa os formulários e liga o computador. Quando a primeira pessoa chega, ele já sabe quantas estão à frente dela e quanto tempo, em média, cada uma levará.</p>
<p>Rui acredita que atender bem não é falar bonito, mas resolver. Por isso, quando não encontra a informação, não improvisa uma resposta: anota o caso, avisa o prazo e liga de volta. No fim do dia, o caderno de ligações vazio é a sua melhor avaliação.</p>`
  },
  poupa: {
    titulo: "A torneira que pinga",
    autor: "Texto original",
    html: `<p>Uma pequena torneira que pinga parece inofensiva. Ao longo de um mês, porém, ela pode desperdiçar muitos litros de água tratada. A conta chega no fim do mês, mas o prejuízo maior é invisível: a água que se perde não volta ao rio.</p>
<p>Consertar um vazamento doméstico custa pouco; ignorá-lo custa caro, para a casa e para a cidade.</p>`
  }
};

// Prova 1: questões transcritas do caderno FUNDEP / DMAE Uberlândia 2020 (Oficial Administrativo, código 302).
// Gabarito resolvido por análise; itens marcados com conf:'verificar' devem ser conferidos com o gabarito oficial.
PROVAS[1] = {
  id: 1,
  titulo: "Prova 1",
  origem: "Prova real FUNDEP / DMAE 2020",
  q: [
    // ---------- LÍNGUA PORTUGUESA ----------
    ["LP", "Esse texto é", ["uma crônica.", "uma lenda.", "um conto.", "uma fábula."], 3,

    ["LP", "Considere as afirmativas a seguir.<br>I. A onça caiu da árvore em consequência de ter ficado seriamente enferma.<br>II. A onça não podia caçar, todavia, padecia de fome.<br>III. O jabuti não viu rastro sainte, portanto desconfiou.<br><br>Está(ão) correta(s) a(s) afirmativa(s)",

    // ---------- RACIOCÍNIO LÓGICO ----------
    ["RL", "No ano de 1985, o pai de Vítor disse a ele o seguinte: “Se neste ano meu pai estivesse vivo, a idade dele seria a soma da sua idade com o dobro da minha, ou seja, 79 anos”.<br>Anos se passaram até que Vítor resolveu calcular qual era a idade de seu pai quando, em 1985, ele havia lhe dito isso. Foi então que Vítor, no ano de 2019, já com 41 anos completos, descobriu, corretamente, que a idade de seu pai no ano de 1985 era",
      ["29 anos.", "34 anos.", "36 anos.", "41 anos."], 2,
      "Em 1985, Vítor tinha 41 − 34 = 7 anos. Então 7 + 2P = 79, o que dá P = 36 anos.", {}],
    ["RL", "Na figura a seguir, o cubo maior é constituído por 64 cubinhos idênticos. O cubo maior terá todas as suas faces totalmente pintadas com tinta de mesma cor. Após as faces do cubo serem pintadas, a razão entre o número de cubinhos que não terão nenhuma das suas faces pintadas e o número dos que terão pelo menos uma de suas faces pintadas é igual a",
      ["1/7", "1/8", "1/16", "1/14"], 0,
      "O cubo é 4×4×4. Sem tinta fica só o miolo 2×2×2 = 8 cubinhos. Com tinta ficam 64 − 8 = 56. A razão é 8/56 = 1/7.", { fig: ["cube", 4] }],
    ["RL", "Após assaltarem um posto de gasolina, os ladrões saíram em um carro com velocidade constante igual a 100 km/h. Após exatos 30 minutos que os ladrões saíram em fuga, a polícia começou a perseguição a eles em uma viatura com velocidade constante de 120 km/h.<br>Se o carro dos ladrões e a viatura policial mantiveram suas velocidades constantes, quanto tempo após começarem a perseguição, a viatura policial alcançará o carro dos ladrões?",
      ["2 horas e 20 minutos.", "2 horas e 30 minutos.", "2 horas e 40 minutos.", "2 horas e 50 minutos."], 1,
      "Vantagem inicial: 100 × 0,5 = 50 km. A viatura recupera 120 − 100 = 20 km por hora, então leva 50 / 20 = 2,5 h = 2 h 30 min.", {}],
    ["RL", "A primeira fase, correspondente à prova escrita de um concurso para provimento de cargo público, será realizada em um sábado. Já a segunda fase desse concurso ocorrerá 57 dias após a primeira.<br>Logo, o dia da semana em que ocorrerá a segunda fase desse concurso é um(a)",
      ["sábado.", "domingo.", "segunda-feira.", "terça-feira."], 1,
      "57 = 8 × 7 + 1. Sobra 1 dia, e o dia seguinte ao sábado é domingo.", {}],
    ["RL", "O diretor do museu do futebol de uma capital brasileira resolveu organizar o número de visitantes que passavam por lá em cada um dos cinco dias de visitação da semana. Os resultados foram contabilizados em uma tabela. As quatro entradas diárias ficam nas colunas, da esquerda para a direita, e os cinco dias da semana ficam nas linhas, de cima para baixo.<br><table class='tb'><tr><td>20</td><td>25</td><td>15</td><td>22</td></tr><tr><td>24</td><td>22</td><td>19</td><td>26</td></tr><tr><td>12</td><td>30</td><td>33</td><td>28</td></tr><tr><td>18</td><td>32</td><td>25</td><td>25</td></tr><tr><td>26</td><td>28</td><td>12</td><td>18</td></tr></table>O elemento da quarta linha e terceira coluna, 25, corresponde ao número de pessoas que visitaram o museu no 4º dia da semana e no 3º horário de visitação do dia.<br>O número total de visitações ao museu que aconteceram ao longo dos cinco dias da semana, no segundo horário de visitação, é igual a",
      ["84.", "91.", "119.", "137."], 3,
      "O segundo horário corresponde à segunda coluna: 25 + 22 + 30 + 32 + 28 = 137.", {}],
    ["RL", "Mário gasta, exatamente, 20% do seu salário mensal com o aluguel de sua casa.<br>Se, em um determinado mês, o salário de Mário tiver um reajuste (aumento) correspondente a 50% e, nesse mesmo mês, o valor do aluguel de sua casa tiver um aumento de 20%, o percentual de seu salário que ele gastará com o aluguel será igual a",
      ["15%.", "16%.", "22%.", "24%."], 1,
      "Com salário S, o aluguel passa de 0,20S para 0,24S e o salário passa a 1,5S. A fração é 0,24 / 1,5 = 0,16, ou seja, 16%.", {}],
    ["RL", "Cada 20 gotas de um medicamento correspondem ao equivalente de 1 mL. No rótulo desse medicamento, há a indicação de que o princípio ativo tem uma concentração de 2,5 mg/mL, ou seja, cada 1 mL do medicamento contém 2,5 mg de princípio ativo. Um médico prescreveu a seu paciente a ingestão de, exatamente, 6,0 mg do princípio ativo desse remédio todos os dias pela manhã.<br>Para que esse paciente siga, rigorosamente, a prescrição do médico, ele deve ingerir pela manhã uma quantidade, em gotas, do medicamento igual a",
      ["40.", "44.", "48.", "52."], 2,
      "6,0 mg ÷ 2,5 mg/mL = 2,4 mL. Como 1 mL = 20 gotas, são 2,4 × 20 = 48 gotas.", {}],
    ["RL", "Uma empresa decidiu criar um sistema de pontuação que era proporcional à produtividade de seus funcionários. Ou seja, se um funcionário, de acordo com os parâmetros da empresa, de um mês para outro dobrasse sua produção, dentro das mesmas condições de trabalho, a sua pontuação também seria dobrada.<br>Maria e Rute são duas funcionárias dessa empresa. Elas trabalham na mesma função, cumprindo a mesma jornada de trabalho, no entanto, a pontuação de Rute, em todos os meses, é 25% maior que a pontuação de Maria.<br>Mantendo cada uma a mesma produtividade, se em um dia de trabalho, Maria executa um serviço em 12 horas, Rute cumpre esse mesmo serviço num tempo igual a",
      ["9 horas e 25 minutos.", "9 horas e 36 minutos.", "10 horas.", "10 horas e 24 minutos."], 1,
      "Rute é 25% mais produtiva, então seu tempo é 12 / 1,25 = 9,6 h = 9 h 36 min.", {}],
    ["RL", "Em um lava-jato, Romário lava dez carros no tempo de 4 horas. Já Bebeto, menos experiente que Romário, lava os mesmos dez carros nas mesmas condições, em um tempo de 6 horas.<br>Se Romário e Bebeto trabalharem juntos, eles lavarão esses dez carros em um tempo igual a",
      ["2 horas e 40 minutos.", "2 horas e 24 minutos.", "5 horas.", "5 horas e 30 minutos."], 1,
      "Juntos, em 1 hora fazem 1/4 + 1/6 = 5/12 do trabalho. O tempo total é 12/5 h = 2,4 h = 2 h 24 min.", {}],
    ["RL", "Em uma escola de educação infantil, no espaço destinado para jogos e brincadeiras, foi desenhado no chão a forma geométrica de um hexágono regular como o da figura a seguir.<br>O desenho do hexágono é fixo no chão, no entanto, seus lados são cobertos por peças coloridas, cada lado uma peça, de tal forma que as cores dos lados podem variar de acordo com a disposição das peças.<br>Se existem sete peças de cores distintas para serem colocadas sobre cada lado do hexágono, qual o número total de formas diferentes que se pode colocar essas peças sobre esses lados?",
      ["120.", "720.", "2520.", "5040."], 3,
      "Como o desenho é fixo, os 6 lados são distinguíveis. Escolhem-se 6 peças das 7 em ordem: 7 × 6 × 5 × 4 × 3 × 2 = 5040.", { fig: ["hex"] }],
    // ---------- ATUALIDADES ----------
    ["AT", "Os especialistas explicam que a expansão das principais facções criminosas do país, o Primeiro Comando da Capital (PCC) e o Comando Vermelho (CV), rumo ao Norte e Nordeste, resultou em uma guerra entre elas dentro dos presídios. “O ano de 2017 começou com matanças nos presídios no Amazonas, Rio Grande do Norte e Roraima. O sistema ficou muito conflagrado, porque se imaginava depois dessas três ondas um efeito dominó”, explica Paes Manso, coautor do livro <i>A guerra: a ascensão do PCC e o mundo do crime no Brasil</i>. A guerra nos presídios teve reflexos nas ruas, acirrando os conflitos e elevando os índices de criminalidade daquele ano. Mas, com o tempo, a tensão entre os grupos rivais começou a diminuir a partir de armistícios e pactos de não agressão.<br><small>Disponível em: brasil.elpais.com, 20 jul. 2019.</small><br><br>De acordo com o texto, a tendência de queda da violência no Brasil, que começou no início de 2018, pode ser explicada",
      ["pela própria dinâmica do mercado do crime.", "pelas ações oficiais tomadas pelo Governo Federal.", "pela extinção das principais facções criminosas do país.", "pelo aumento da tensão entre os grupos criminosos rivais."], 0,
      "O texto atribui a queda aos armistícios e pactos de não agressão entre as facções, ou seja, a um movimento do próprio mercado do crime.", {}],
    ["AT", "Analise a afirmativa a seguir.<br>“Para você ter queimada natural, você precisa da existência de raios.” (Alberto Setzer, pesquisador do Programa Queimadas do Inpe, g1, 19 ago. 2019)<br>A declaração do pesquisador corrobora com a tese de que parte das queimadas que atingiram o Brasil em meados de 2019",
      ["tiveram início na fronteira do estado do Amazonas com a Venezuela, resultado das ações criminosas de pessoas ligadas ao presidente Nicolás Maduro.",
       "são fenômenos naturais que acontecem especialmente na região Norte do Brasil, que anualmente apresenta os menores índices pluviométricos do país.",
       "foram provocadas por ações humanas, já que, nesse período, as regiões mais afetadas por essas queimadas encontravam-se em um prolongado período de seca.",
       "ocorreram devido à cultura dos povos indígenas da Amazônia de queimar áreas para “limpar” o terreno para o cultivo, prática que se configura criminosa, segundo a lei de Crimes Ambientais."], 2,
      "Sem raios, a queimada não é natural. Como a época era de seca prolongada e não de tempestades, o fogo teve origem em ações humanas.", {}],
    ["AT", "O MPF (Ministério Público Federal) entrou com uma ação contra a União por omissão no desastre das manchas de óleo no Nordeste. A Procuradoria pede que, em 24 horas, seja colocado em ação o Plano Nacional de Contingência para Incidentes de Poluição por Óleo em Água. Segundo o MPF, trata-se do maior desastre ambiental da história no litoral brasileiro em termos de extensão. Para a Procuradoria, a União está sendo omissa por protelar medidas protetivas e não atuar de forma articulada na região atingida pelos vazamentos.<br><small>Folha de S.Paulo, out. 2019 (adaptação).</small><br><br>A situação descrita na notícia tem provocado muito debate acerca das responsabilidades no processo de preservação ambiental. Nesse contexto, são ações que, obrigatórias ou não, colaboram com a proteção dos ecossistemas, exceto:",
      ["Corte de investimentos públicos em iniciativas comprometidas com a conscientização ambiental.",
       "Limpeza manual das praias, efetuada por turistas, habitantes e trabalhadores das áreas afetadas.",
       "Fortalecimento da legislação ambiental, visando à responsabilização efetiva de agentes degradantes.",
       "Aumento da fiscalização dos órgãos responsáveis, a fim de apurar falhas administrativas."], 0,
      "Cortar investimentos em conscientização ambiental enfraquece a proteção dos ecossistemas. As demais ações a favorecem.", {}],
    ["AT", "O Papa Francisco fez, na manhã do dia 13 de outubro de 2019, a canonização de Irmã Dulce, a Santa Dulce dos Pobres. 50 mil pessoas acompanharam a cerimônia na Praça São Pedro, no Vaticano. A presença de brasileiros foi bastante visível, com bandeiras do país e pessoas com roupas das cores verde e amarela.<br><small>Gazeta do Povo, 14 out. 2019 (adaptação).</small><br><br>A canonização de Irmã Dulce foi vista pelos membros da igreja católica do Brasil como um marco na história do cristianismo no país, uma vez que",
      ["garante a candidatura de um brasileiro nas próximas eleições papais.", "assegura um prêmio em dinheiro aos cofres da igreja católica no Brasil.", "faz da religiosa baiana a primeira mulher nascida no Brasil a se tornar santa.", "eleva o Brasil à categoria de membro permanente na cúpula da igreja em Roma."], 2,
      "Irmã Dulce, nascida em Salvador, tornou-se a primeira santa nascida no Brasil.", {}],
    ["AT", "“O Ministério Público Federal (MPF) e a mineradora Vale fecharam um Termo de Ajuste Preliminar Extrajudicial (TAP-E) que assegura direitos a indígenas atingidos na tragédia de Brumadinho (MG). O TAP-E Pataxó, como foi apelidado o acordo, estabelece que os indígenas das etnias Pataxó e Pataxó Hã Hã Hãe deverão receber um pagamento mensal emergencial em moldes similares ao compromisso assumido pela Vale com moradores de Córrego do Feijão e do Parque da Cachoeira, comunidades que foram afetadas pelo rompimento da barragem I da Mina Feijão, em Brumadinho.” (Hoje em Dia, 2 nov. 2019)<br><br>O TAP-E Pataxó reconhece os indígenas das etnias Pataxó e Pataxó Hã Hã Hãe como vítimas indiretas do rompimento da barragem I da Mina Feijão, em Brumadinho, uma vez que eles",
      ["tiveram suas aldeias e roças destruídas pela lama, que também intoxicou dezenas de animais e crianças.", "dependiam do Rio Paraopeba, que foi atingido pelos rejeitos oriundos do rompimento da barragem da Vale.", "trabalhavam com mineração de ouro nas terras onde se localizava a barragem I da Mina Feijão, em Brumadinho.", "viviam na periferia de Brumadinho, cidade que foi devastada pela onda de rejeitos causada pelo rompimento."], 1,
      "São vítimas indiretas porque dependiam do Rio Paraopeba, atingido pelos rejeitos. Quem teve casas ou roças destruídas pela lama foi vítima direta.", {}],
    // ---------- LEGISLAÇÃO ----------
    ["LG", "Sobre os objetivos prioritários do município de Uberlândia previstos na Lei Orgânica, assinale com V as afirmativas verdadeiras e com F as falsas.<br>( ) É objetivo prioritário do município promover adequado ordenamento territorial, de modo a assegurar a qualidade de vida de sua população, incentivando-se o êxodo rural e a integração urbana.<br>( ) É objetivo prioritário do município promover planos, programas e projetos de interesse dos segmentos mais carentes da sociedade, realizando a desapropriação de área rural para fins de reforma agrária.<br>( ) É objetivo prioritário do município promover o desenvolvimento econômico com justa distribuição de renda entre todos os segmentos da população.<br>( ) É objetivo prioritário do município garantir a participação popular nas ações de governo.<br><br>Assinale a sequência correta.",
      ["F F V V", "F V F V", "V F F F", "V V V F"], 0,
      "Nenhum ordenamento territorial incentiva o êxodo rural (a Lei Orgânica fala em evitá-lo), e a desapropriação para reforma agrária é competência da União. Os dois últimos objetivos são verdadeiros. Gabarito deduzido, conferir com o texto da Lei Orgânica.", { conf: "verificar" }],
    ["LG", "Segundo o Art. 76 da Lei Orgânica do Município de Uberlândia, os Poderes Legislativo e Executivo são obrigados a fornecer, a qualquer interessado, no prazo máximo de _________, certidões de atos, contratos e decisões, sob pena de responsabilidade da autoridade ou servidor público municipal que negar ou retardar sua expedição, assim como atender às requisições judiciais em igual prazo, se outro não for fixado pelo requisitante.<br>Assinale a alternativa que completa corretamente a lacuna anterior.",
      ["dez dias.", "15 dias.", "30 dias.", "90 dias."], 1,
      "Marcada como 15 dias por ser o prazo usual das leis orgânicas municipais para certidões. Não consegui localizar o texto do Art. 76 para confirmar, então confira com o gabarito oficial.", { conf: "verificar" }],
    ["LG", "Considere que uma pessoa tomou posse como servidor público do município de Uberlândia.<br>Nos termos do Art. 61 da Lei Orgânica do Município de Uberlândia, são direitos assegurados a essa pessoa, exceto:",
      ["Décimo-terceiro salário, com base na remuneração integral ou no valor da aposentadoria.", "Proibição de diferença de salários, de exercícios de função e de critério de admissão, salvo se por motivo de sexo, idade, cor ou estado civil.", "Remuneração do trabalho noturno superior ao do diurno.", "Salário-família para os seus dependentes."], 1,
      "A Constituição proíbe diferença de salários e de critérios de admissão por motivo de sexo, idade, cor ou estado civil, sem exceção. A cláusula “salvo se por motivo de” inverte a regra.", {}],
    ["LG", "De acordo com o Art. 26 da Lei Complementar municipal nº 40/1992, que dispõe sobre o estatuto dos servidores públicos do município de Uberlândia, suas autarquias, fundações públicas e câmara municipal, o servidor habilitado em concurso público e empossado em cargo de provimento efetivo adquirirá estabilidade no serviço público ao completar quantos anos de efetivo exercício?",
      ["Dois.", "Três.", "Quatro.", "Cinco."], 1,
      "A Constituição Federal (art. 41, após a EC 19/1998) fixa três anos de efetivo exercício. Não encontrei o texto atualizado do art. 26 da LC 40/1992, então confira com o gabarito oficial.", { conf: "verificar" }],
    ["LG", "São tipos de penalidades disciplinares previstas no Estatuto dos Servidores do município de Uberlândia, exceto:",
      ["Advertência.", "Suspensão.", "Admoestação.", "Cassação de aposentadoria."], 2,
      "Os estatutos de servidores preveem advertência, suspensão, demissão e cassação de aposentadoria ou disponibilidade. “Admoestação” não é penalidade formal.", { conf: "verificar" }],
    // ---------- CONHECIMENTOS ESPECÍFICOS ----------
    ["CE", "Nos contextos das iniciativas pública e privada e suas características, tem-se o que é chamado linha de convergência.<br>Nesse sentido, considere as afirmativas a seguir.<br>I. Ambas devem utilizar técnicas administrativas como planejamento, direção, controle, motivação de pessoal e avaliação de resultados.<br>II. Sofrem influência do ambiente no qual atuam referentes a fatores econômicos, sociais, políticos, ambientais e tecnológicos.<br>III. A orientação principal sempre é voltada para o bem-estar da sociedade / cliente.<br><br>Estão corretas as afirmativas",
      ["I e II, apenas.", "II e III, apenas.", "I e III, apenas.", "I, II e III."], 0,
      "I e II descrevem o que há de comum entre as duas gestões. A III generaliza demais: a orientação do setor privado é o lucro, e o bem-estar do cliente é meio para isso.", {}],

/* ---------- figuras ---------- */
const FIG = {
  cube(n) {
    const s = 34, k = 0.5, ox = 14;
    const W = n * s, D = n * s * k;
    const oy0 = W + D + 10;
    const P = (x, y, z) => [(ox + x * s + z * k * s).toFixed(1), (oy0 - y * s - z * k * s).toFixed(1)];
    const poly = (pts, cls) => '<polygon class="' + cls + '" points="' + pts.map(p => p.join(",")).join(" ") + '"/>';
    const ln = (a, b) => '<line x1="' + a[0] + '" y1="' + a[1] + '" x2="' + b[0] + '" y2="' + b[1] + '"/>';
    let g = "";
    g += poly([P(0, 0, 0), P(n, 0, 0), P(n, n, 0), P(0, n, 0)], "f1");
    g += poly([P(0, n, 0), P(n, n, 0), P(n, n, n), P(0, n, n)], "f2");
    g += poly([P(n, 0, 0), P(n, 0, n), P(n, n, n), P(n, n, 0)], "f3");
    for (let i = 0; i <= n; i++) {
      g += ln(P(i, 0, 0), P(i, n, 0)) + ln(P(0, i, 0), P(n, i, 0));
      g += ln(P(0, n, i), P(n, n, i)) + ln(P(i, n, 0), P(i, n, n));
      g += ln(P(n, 0, i), P(n, n, i)) + ln(P(n, i, 0), P(n, i, n));
    }
    const w = ox * 2 + W + D, h = oy0 + 8;
    return '<svg viewBox="0 0 ' + w.toFixed(0) + " " + h.toFixed(0) + '" width="' + w.toFixed(0) + '" role="img" aria-label="Cubo formado por ' + (n * n * n) + ' cubinhos"><style>.f1{fill:var(--accent-soft)}.f2{fill:var(--bg)}.f3{fill:var(--bar)}.cb line{stroke:var(--ink);stroke-width:1.2}.cb polygon{stroke:var(--ink);stroke-width:2}</style><g class="cb">' + g + "</g></svg>";
  },
  hex() {
    const r = 90, cx = 120, cy = 100;
    const pts = [];
    for (let i = 0; i < 6; i++) { const a = Math.PI / 3 * i; pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); }
    const lab = [];
    for (let i = 0; i < 6; i++) {
      const a = pts[i], b = pts[(i + 1) % 6];
      const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
      const dx = mx - cx, dy = my - cy, d = Math.hypot(dx, dy);
      lab.push('<text x="' + (mx + dx / d * 14).toFixed(1) + '" y="' + (my + dy / d * 14 + 4).toFixed(1) + '" text-anchor="middle" font-size="12" fill="var(--muted)">lado ' + (i + 1) + "</text>");
    }
    return '<svg viewBox="0 0 240 200" width="240" role="img" aria-label="Hexágono regular com seis lados"><polygon points="' + pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ") + '" fill="var(--accent-soft)" stroke="var(--ink)" stroke-width="2.5"/>' + lab.join("") + "</svg>";
  },
  venn(la, lb, a, ab, b) {
    const W = 380, H = 220;
    return '<svg viewBox="0 0 ' + W + " " + H + '" width="' + W + '" role="img" aria-label="Diagrama de dois conjuntos: ' + la + " e " + lb + '"><circle cx="150" cy="112" r="78" fill="var(--accent)" fill-opacity=".22" stroke="var(--ink)" stroke-width="2"/><circle cx="230" cy="112" r="78" fill="var(--ok)" fill-opacity=".22" stroke="var(--ink)" stroke-width="2"/>' +
      '<text x="116" y="20" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">' + la + '</text><text x="264" y="20" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">' + lb + '</text>' +
      '<text x="112" y="120" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)">' + a + '</text><text x="190" y="120" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)">' + ab + '</text><text x="268" y="120" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)">' + b + "</text></svg>";
  },
  tri(a, b) {
    const sc = 24, w = a * sc, h = b * sc, ox = 40, oy = 20;
    const A = [ox, oy + h], B = [ox + w, oy + h], C = [ox, oy];
    return '<svg viewBox="0 0 ' + (w + 90) + " " + (h + 60) + '" width="' + (w + 90) + '" role="img" aria-label="Triângulo retângulo de catetos ' + a + " e " + b + '"><polygon points="' + [A, B, C].map(p => p.join(",")).join(" ") + '" fill="var(--accent-soft)" stroke="var(--ink)" stroke-width="2.5"/><path d="M' + A[0] + "," + (A[1] - 14) + " h14 v14" + '" fill="none" stroke="var(--ink)" stroke-width="1.5" transform="translate(0,0)"/><text x="' + (ox + w / 2) + '" y="' + (oy + h + 22) + '" text-anchor="middle" font-size="14" fill="var(--ink)">' + a + ' cm</text><text x="' + (ox - 10) + '" y="' + (oy + h / 2 + 5) + '" text-anchor="end" font-size="14" fill="var(--ink)">' + b + " cm</text></svg>";
  },
  bars(title, labels, values) {
    const W = 440, H = 250, L = 44, R = 12, T = 34, B = 34;
    const max = Math.max(...values);
    const step = max <= 100 ? 20 : 50;
    const top = Math.ceil(max / step) * step;
    const iw = W - L - R, ih = H - T - B;
    const bw = iw / values.length;
    let g = '<text x="' + L + '" y="18" font-size="14" font-weight="700" fill="var(--ink)">' + title + "</text>";
    for (let v = 0; v <= top; v += step) {
      const y = T + ih - v / top * ih;
      g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="var(--line)" stroke-width="1"/>';
      g += '<text x="' + (L - 6) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end" font-size="11" fill="var(--muted)">' + v + "</text>";
    }
    values.forEach((v, i) => {
      const x = L + i * bw + bw * 0.2, w = bw * 0.6, h = v / top * ih, y = T + ih - h;
      g += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + h.toFixed(1) + '" fill="var(--accent)"/>';
      g += '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (y - 5).toFixed(1) + '" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">' + v + "</text>";
      g += '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (H - 12) + '" text-anchor="middle" font-size="12" fill="var(--ink)">' + labels[i] + "</text>";
    });
    g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + (T + ih) + '" y2="' + (T + ih) + '" stroke="var(--ink)" stroke-width="1.5"/>';
    return '<svg viewBox="0 0 ' + W + " " + H + '" width="' + W + '" role="img" aria-label="Gráfico de barras: ' + title + '">' + g + "</svg>";
  }
};
function figHtml(f) {
  if (!f) return "";
  const [name, ...args] = f;
  return '<div class="fig">' + FIG[name](...args) + "</div>";
}

/* ---------- estado ---------- */
let S = null;          // sessão atual
let tick = null;
const app = document.getElementById("app");

function pool(set) { return typeof set === "number" ? PROVAS[set].qs : ALL.filter(q => q.area === set); }
function setTitle(set) { return typeof set === "number" ? "Prova " + set : AREAS[set]; }

function persist() {
  if (!S) return;
  store.set(keyOf(S.mode, S.set), { answers: S.answers, flags: S.flags, idx: S.idx, elapsed: elapsedNow(), done: S.done });
}
function elapsedNow() { return S.base + (S.done ? 0 : Math.floor((Date.now() - S.t0) / 1000)); }

function start(mode, set, fresh) {
  const saved = fresh ? null : store.get(keyOf(mode, set));
  const qs = pool(set);
  S = {
    mode, set, qs,
    answers: (saved && saved.answers) || {},
    flags: (saved && saved.flags) || {},
    idx: saved && !saved.done ? Math.min(saved.idx || 0, qs.length - 1) : 0,
    base: saved && !saved.done ? saved.elapsed || 0 : 0,
    t0: Date.now(), done: false, confirm: false, filter: "all"
  };
  if (saved && saved.done) { S.answers = {}; S.flags = {}; }
  persist();
  renderQuiz();
  window.scrollTo(0, 0);
}

function stopTimer() { if (tick) { clearInterval(tick); tick = null; } }
function fmt(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return (h ? h + ":" : "") + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}

function optHtml(q, ans, mode, reveal) {
  return q.alts.map((t, i) => {
    let cls = "opt", dis = "";

      dis = " disabled";
      if (i === q.gab) cls += " ok"; else if (i === ans) cls += " bad";
    }
    const pressed = !reveal && ans === i ? "true" : "false";
    return '<button class="' + cls + '" data-opt="' + i + '" aria-pressed="' + pressed + '"' + dis + '><span class="bub">' + LETRAS[i] + '</span><span class="otx">' + t + "</span></button>";
  }).join("");
}
function baseHtml(q) {

function sheetHtml() {

    return '<div class="row' + (i === S.idx ? " cur" : "") + (S.flags[q.id] ? " flag" : "") + '"><button class="rn" data-go="' + i + '" aria-label="Ir para a questão ' + (i + 1) + '">' + (i + 1) + "</button>" + bubs + "</div>";
  }).join("");
  const n = Object.keys(S.answers).length;
  return '<h2>Folha de respostas <span>' + n + "/" + S.qs.length + '</span></h2><div class="grid">' + rows + '</div><div class="legend"><span><i style="background:var(--accent)"></i>marcada</span><span><i style="background:var(--flag)"></i>para revisar</span></div>';
}

function renderQuiz() {
  const q = S.qs[S.idx];
  const ans = S.answers[q.id];
  const treino = S.mode === "treino";
  const reveal = treino && ans !== undefined;
  const n = Object.keys(S.answers).length;
  const blank = S.qs.length - n;
  const confirm = S.confirm
    ? '<div class="confirm"><div>' + (blank ? "Você deixou " + blank + (blank === 1 ? " questão em branco." : " questões em branco.") : "Todas as questões foram marcadas.") + " Finalizar agora?</div><div class=\"btn-row\"><button class=\"btn primary\" data-act=\"finish-yes\">Finalizar e ver a correção</button><button class=\"btn\" data-act=\"finish-no\">Voltar à prova</button></div></div>"
    : "";
  const last = S.idx === S.qs.length - 1;
  app.innerHTML =
    '<div class="topbar"><div class="title">' + setTitle(S.set) + '<span class="sub">' + (treino ? "Modo treino" : "Modo prova") + '</span></div><span class="timer" id="timer" aria-label="Tempo decorrido">' + fmt(elapsedNow()) + '</span><button class="btn small" data-act="home">Sair</button><button class="btn small primary" data-act="finish">' + (treino ? "Encerrar" : "Finalizar prova") + "</button></div>" + confirm +
    '<div class="quiz"><section class="qcard"><div class="bar-label">' + AREAS[q.area] + '</div><div class="inner"><div class="qhead"><span class="qnum">Questão ' + (S.idx + 1) + ' <span class="mono" style="font-size:14px;color:var(--muted);font-weight:500">de ' + S.qs.length + "</span></span>" +
    (treino && typeof S.set !== "number" ? '<span class="chip">Prova ' + q.prova + " · nº " + q.n + "</span>" : "") +
    '<button class="flagbtn" data-act="flag" aria-pressed="' + (S.flags[q.id] ? "true" : "false") + '">' + (S.flags[q.id] ? "Marcada para revisar" : "Marcar para revisar") + "</button></div>" +
    bodyHtml(q, ans, S.mode, reveal) + (reveal ? feedbackHtml(q, ans) : "") +
    '<div class="nav desk-nav"><button class="btn" data-act="prev"' + (S.idx === 0 ? " disabled" : "") + '>Anterior</button>' + (treino && ans !== undefined ? '<button class="btn link" data-act="retry">Refazer questão</button>' : "") + '<button class="btn primary" data-act="next"' + (last ? " disabled" : "") + ">Próxima</button></div></div></section>" +
    '<aside class="sheet" id="sheet" aria-label="Folha de respostas">' + sheetHtml() + "</aside></div>" +
    '<div class="mbar"><button class="btn" data-act="prev"' + (S.idx === 0 ? " disabled" : "") + '>Anterior</button><button class="btn" data-act="sheet">Folha ' + n + "/" + S.qs.length + '</button><button class="btn primary" data-act="next"' + (last ? " disabled" : "") + ">Próxima</button></div>";
  stopTimer();
  tick = setInterval(() => { const el = document.getElementById("timer"); if (el && S) el.textContent = fmt(elapsedNow()); }, 1000);
}

function mark(i, j) {
  const q = S.qs[i];
  if (S.mode === "treino" && S.answers[q.id] !== undefined) return;
  S.answers[q.id] = j;
  S.idx = i;
  persist();
  renderQuiz();
}
function go(i) {
  S.idx = Math.max(0, Math.min(S.qs.length - 1, i));
  persist();
  renderQuiz();
  const sh = document.getElementById("sheet"); if (sh) sh.classList.remove("open");
  window.scrollTo(0, 0);
}

/* ---------- resultado ---------- */
function finish() {
  S.done = true;
  S.final = elapsedNow();
  S.base = S.final;
  stopTimer();
  const ok = S.qs.filter(q => S.answers[q.id] === q.gab).length;
  persist();
  if (S.mode === "prova" && typeof S.set === "number") store.set("dmae:best:" + S.set, { ok, total: S.qs.length, t: S.final });
  renderResult();
  window.scrollTo(0, 0);
}
function renderResult() {
  const total = S.qs.length;
  const ok = S.qs.filter(q => S.answers[q.id] === q.gab).length;
  const blank = S.qs.filter(q => S.answers[q.id] === undefined).length;
  const wrong = total - ok - blank;
  const pct = Math.round(ok / total * 100);
  const by = AREA_ORDER.map(a => {
    const qs = S.qs.filter(q => q.area === a);
    if (!qs.length) return "";
    const o = qs.filter(q => S.answers[q.id] === q.gab).length;
    return '<div class="ab"><span>' + AREAS[a] + '</span><span class="track"><span class="fill" style="width:' + (o / qs.length * 100).toFixed(0) + '%"></span></span><span class="v">' + o + "/" + qs.length + "</span></div>";
  }).join("");
  const items = S.qs.map((q, i) => {
    const a = S.answers[q.id];
    const st = a === undefined ? "no" : a === q.gab ? "ok" : "bad";
    if (S.filter === "bad" && st !== "bad") return "";
    if (S.filter === "no" && st !== "no") return "";
    const label = st === "ok" ? "Certa" : st === "bad" ? "Errada" : "Em branco";
    const ref = typeof S.set !== "number" ? " · Prova " + q.prova + " nº " + q.n : "";
    return '<details><summary><span class="st ' + st + '">' + String(i + 1).padStart(2, "0") + '</span><span>' + label + '</span><span class="ar">' + AREAS[q.area] + ref + "</span></summary><div class=\"body\">" + baseHtml(q) + figHtml(q.fig) + '<div class="enun">' + q.enun + '</div><div class="opts">' + review(q, a) + "</div>" +
      '<div class="feedback ' + (st === "ok" ? "ok" : "bad") + '"><div><b>Resposta: ' + LETRAS[q.gab] + ".</b>" + (a === undefined ? " Você não marcou nenhuma alternativa." : a === q.gab ? " Você acertou." : " Você marcou " + LETRAS[a] + ".") + (q.conf ? ' <span class="warn">gabarito a conferir</span>' : "") + "</div><div>" + q.exp + "</div></div></div></details>";
  }).join("") || '<div class="empty">Nenhuma questão nesta lista.</div>';
  app.innerHTML =
    '<div class="topbar"><div class="title">' + setTitle(S.set) + '<span class="sub">Correção</span></div><button class="btn small" data-act="home">Início</button><button class="btn small primary" data-act="again">Refazer</button></div>' +
    '<section class="score"><div class="big">' + ok + '<small> / ' + total + "</small></div><div><b>" + pct + "% de acertos.</b> " + wrong + " erradas, " + blank + ' em branco. Tempo: <span class="mono">' + fmt(S.final || 0) + '</span>.</div><div class="areabars">' + by + "</div></section>" +
    '<h2 class="section-title">Revisão questão por questão</h2><div class="filters"><button class="btn small" data-filter="all" aria-pressed="' + (S.filter === "all") + '">Todas</button><button class="btn small" data-filter="bad" aria-pressed="' + (S.filter === "bad") + '">Erradas</button><button class="btn small" data-filter="no" aria-pressed="' + (S.filter === "no") + '">Em branco</button></div><div class="review">' + items + "</div>";
}
function review(q, a) {
  return q.alts.map((t, i) => {
    let cls = "opt";
    if (i === q.gab) cls += " ok"; else if (i === a) cls += " bad";
    return '<div class="' + cls + '"><span class="bub">' + LETRAS[i] + '</span><span class="otx">' + t + "</span></div>";
  }).join("");
}

/* ---------- eventos ---------- */
app.addEventListener("click", e => {
  const t = e.target.closest("button");
  if (!t || t.disabled) return;
  if (t.dataset.opt !== undefined) return mark(S.idx, +t.dataset.opt);
  if (t.dataset.bub) {
    const [i, j] = t.dataset.bub.split(":").map(Number);
    if (S.mode === "prova") return mark(i, j);
    return go(i);
  }
  if (t.dataset.go !== undefined) return go(+t.dataset.go);
  if (t.dataset.filter) { S.filter = t.dataset.filter; return renderResult(); }
  switch (t.dataset.act) {
    case "prova": return start("prova", +t.dataset.k, false);
    case "treino": return start("treino", +t.dataset.k, false);
    case "area": return start("treino", t.dataset.k, false);
    case "reset": store.del(keyOf("prova", +t.dataset.k)); return renderHome();
    case "home": persist(); return renderHome();
    case "prev": return go(S.idx - 1);
    case "next": return go(S.idx + 1);
    case "flag": { const q = S.qs[S.idx]; if (S.flags[q.id]) delete S.flags[q.id]; else S.flags[q.id] = 1; persist(); return renderQuiz(); }
    case "retry": { delete S.answers[S.qs[S.idx].id]; persist(); return renderQuiz(); }
    case "sheet": { const sh = document.getElementById("sheet"); if (sh) sh.classList.toggle("open"); return; }
    case "finish": S.confirm = true; return renderQuiz();
    case "finish-no": S.confirm = false; return renderQuiz();
    case "finish-yes": return finish();
    case "again": return start(S.mode, S.set, true);
  }
});
document.addEventListener("keydown", e => {
  if (!S || S.done || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  const m = { a: 0, b: 1, c: 2, d: 3, "1": 0, "2": 1, "3": 2, "4": 3 };
  if (k in m) { mark(S.idx, m[k]); }
  else if (e.key === "ArrowRight") go(S.idx + 1);
  else if (e.key === "ArrowLeft") go(S.idx - 1);
});

renderHome();
</script>

</body></html>
